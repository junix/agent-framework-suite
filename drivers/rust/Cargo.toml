[package]
name = "agent-framework-rs-driver"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
agent-framework-rs = { git = "https://github.com/junix/agent-framework-rs.git" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
