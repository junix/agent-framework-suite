<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" xml:lang="zh-CN" aria-labelledby="fig-title fig-desc">
<title id="fig-title">agent-framework-suite：一条路径，不是目录。同一用例经公开 API 分别驱动 Python 与 Rust，共用期望，强制比对。驱动不实现路由或检查点。</title>
<desc id="fig-desc">just check 把用例分发到 Python 与 Rust。两端只调公开 API，写出观测。先对共用期望逐端核对，再强制比对。一致则通过，分叉或缺一端则失败。用例为 WF-001 至 WF-010。封闭执行，无模型、无网络。</desc>
